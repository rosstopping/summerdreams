version: 2
updates:
- package-ecosystem: composer
  directories:
  - /
  - /nova-components/Calendar
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
  registries:
  - nova
- package-ecosystem: npm
  directories:
  - /
  - /nova-components/Calendar
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
- package-ecosystem: composer
  directories:
  - /nova-components/SeasonalLineChart
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
  registries:
  - nova
- package-ecosystem: npm
  directories:
  - /nova-components/SeasonalLineChart
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
- package-ecosystem: github-actions
  directories:
  - /
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
registries:
  nova:
    type: composer-repository
    url: https://nova.laravel.com
    username: ${{secrets.NOVA_USERNAME}}
    password: ${{secrets.NOVA_PASSWORD}}
